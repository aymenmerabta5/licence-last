name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: cd-deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image.outputs.ref }}
    steps:
      - name: Checkout dispatched revision
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Checkout CI-passed revision
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_BETTER_AUTH_URL=${{ secrets.NEXT_PUBLIC_BETTER_AUTH_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_FEATURE_NOTIF_PREFERENCES=${{ vars.NEXT_PUBLIC_FEATURE_NOTIF_PREFERENCES || 'true' }}
            NEXT_PUBLIC_FEATURE_SAVED_OFFERS=${{ vars.NEXT_PUBLIC_FEATURE_SAVED_OFFERS || 'true' }}
            NEXT_PUBLIC_FEATURE_INTERVIEWS=${{ vars.NEXT_PUBLIC_FEATURE_INTERVIEWS || 'true' }}
            NEXT_PUBLIC_FEATURE_LANGUAGE_REQUIREMENTS=${{ vars.NEXT_PUBLIC_FEATURE_LANGUAGE_REQUIREMENTS || 'true' }}
            FEATURE_COMPANY_ASSISTANT=${{ vars.FEATURE_COMPANY_ASSISTANT || 'false' }}
            NEXT_PUBLIC_FEATURE_COMPANY_ASSISTANT=${{ vars.NEXT_PUBLIC_FEATURE_COMPANY_ASSISTANT || 'false' }}
            AI_API_KEY=build-ai-api-key
            RESEND_API_KEY=build-resend-api-key
            EMAIL_FROM=build@local.test
            S3_BUCKET=build-bucket
            S3_ACCESS_KEY_ID=build-access-key
            S3_SECRET_ACCESS_KEY=build-secret-key
            S3_PUBLIC_URL=${{ secrets.S3_PUBLIC_URL }}
            NEXT_PUBLIC_S3_URL=${{ secrets.NEXT_PUBLIC_S3_URL }}
            S3_ENDPOINT=${{ secrets.S3_ENDPOINT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record exact image reference
        id: image
        run: echo "ref=${IMAGE_NAME}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: /home/${{ secrets.DEPLOY_USER }}/stag
    steps:
      - name: Checkout dispatched revision
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Checkout CI-passed revision
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Sync deployment config
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yml,Caddyfile"
          target: "${{ env.DEPLOY_DIR }}"

      - name: Deploy exact image
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_REF,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail

            cd $HOME/stag

            if [ ! -f .env ]; then
              echo ".env not found at $HOME/stag/.env" >&2
              exit 1
            fi

            python3 - <<'PY'
            import os
            from pathlib import Path

            env_path = Path(".env")
            current_lines = env_path.read_text().splitlines()
            updates = {
                "APP_IMAGE": os.environ["IMAGE_REF"],
            }

            rewritten = []
            updated_keys = set()

            for line in current_lines:
                if "=" not in line or line.lstrip().startswith("#"):
                    rewritten.append(line)
                    continue

                key, _ = line.split("=", 1)
                if key in updates:
                    rewritten.append(f"{key}={updates[key]}")
                    updated_keys.add(key)
                else:
                    rewritten.append(line)

            for key, value in updates.items():
                if key not in updated_keys:
                    rewritten.append(f"{key}={value}")

            env_path.write_text("\n".join(rewritten) + "\n")
            PY

            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            sudo docker compose --env-file .env -f docker-compose.prod.yml pull app
            sudo docker compose --env-file .env -f docker-compose.prod.yml up -d --force-recreate --wait --remove-orphans app redis caddy

            # Auto-seed on first deploy (skip if users already exist)
            POSTGRES_USER="$(awk -F= '/^POSTGRES_USER=/{print $2}' .env | tail -n 1)"
            POSTGRES_DB="$(awk -F= '/^POSTGRES_DB=/{print $2}' .env | tail -n 1)"
            USER_COUNT=$(sudo docker compose -f docker-compose.prod.yml exec -T db psql -U "${POSTGRES_USER:-stag}" -d "${POSTGRES_DB:-stag}" -t -c "SELECT COUNT(*) FROM users;" 2>/dev/null | tr -d ' \n' || echo "0")

            if [ "$USER_COUNT" = "0" ] || [ "$USER_COUNT" = "" ]; then
              echo "Fresh database detected — ensuring schema..."
              sudo docker compose -f docker-compose.prod.yml exec -T db psql -U "${POSTGRES_USER:-stag}" -d "${POSTGRES_DB:-stag}" -c "
                CREATE TABLE IF NOT EXISTS skill_category (
                  id SERIAL PRIMARY KEY,
                  name TEXT NOT NULL UNIQUE,
                  slug TEXT NOT NULL UNIQUE,
                  description TEXT,
                  icon TEXT,
                  status TEXT DEFAULT 'active' NOT NULL,
                  created_at TIMESTAMP DEFAULT NOW() NOT NULL,
                  updated_at TIMESTAMP DEFAULT NOW() NOT NULL
                );
                CREATE TABLE IF NOT EXISTS department_category (
                  id SERIAL PRIMARY KEY,
                  department_id TEXT NOT NULL,
                  category_id INTEGER NOT NULL,
                  created_at TIMESTAMP DEFAULT NOW() NOT NULL,
                  UNIQUE (department_id, category_id)
                );
                ALTER TABLE skill_tag ADD COLUMN IF NOT EXISTS category_id INTEGER;
                ALTER TABLE skill_tag ADD COLUMN IF NOT EXISTS description TEXT;
                ALTER TABLE skill_tag ADD COLUMN IF NOT EXISTS status TEXT DEFAULT 'active';
                ALTER TABLE skill_tag ADD COLUMN IF NOT EXISTS created_by TEXT;
              " 2>/dev/null || true
              echo "Running seed..."
              sudo docker compose -f docker-compose.prod.yml exec -T app bun run src/server/db/seed.ts
              echo "Seed complete."
            else
              echo "Database already seeded ($USER_COUNT users) — skipping."
            fi

            DOMAIN_NAME="$(awk -F= '/^DOMAIN_NAME=/{print $2}' .env | tail -n 1)"
            if [ -z "$DOMAIN_NAME" ]; then
              echo "DOMAIN_NAME is missing in $HOME/stag/.env" >&2
              exit 1
            fi

            # Health check directly via app container (bypasses Caddy TLS on first deploy)
            sudo docker compose --env-file .env -f docker-compose.prod.yml exec -T app \
              bun -e 'fetch("http://localhost:3000/api/health").then(r => r.ok || process.exit(1))'
            echo "Health check passed."

            sudo docker compose --env-file .env -f docker-compose.prod.yml ps

      - name: Cleanup old images on server
        if: success()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            sudo docker image prune -f
