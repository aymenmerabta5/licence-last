name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Foundation checks
  lint-and-typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Architecture guard
        run: bun run lint:architecture

      - name: RTL logical CSS guard
        run: bun run lint:rtl-logical

      - name: Typecheck
        run: bun run typecheck

  # Unit & integration tests
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: lint-and-typecheck
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stag
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci!!
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run all tests
        run: bun run test:ci

  e2e:
    # Temporarily disabled in GitHub Actions while the Playwright/E2E
    # environment issue is investigated.
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stag_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stag_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stag_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stag_e2e
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci!!
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
      REDIS_RATE_LIMIT_ENABLED: "false"
      E2E_DISABLE_CAPTCHA: "1"
      NEXT_PUBLIC_E2E_DISABLE_CAPTCHA: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bun x playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun x playwright test

  # Build check
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - test
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stag
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci!!
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
      # Build-time placeholders only. Real secrets live on the VPS at runtime.
      AI_API_KEY: build-ai-api-key
      RESEND_API_KEY: build-resend-api-key
      EMAIL_FROM: build@local.test
      S3_BUCKET: build-bucket
      S3_ENDPOINT: https://example.com
      S3_ACCESS_KEY_ID: build-access-key
      S3_SECRET_ACCESS_KEY: build-secret-key
      S3_PUBLIC_URL: https://cdn.example.com
      FEATURE_COMPANY_ASSISTANT: "false"
      NEXT_PUBLIC_FEATURE_COMPANY_ASSISTANT: "false"
      REDIS_RATE_LIMIT_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-cache-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-next-cache-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
