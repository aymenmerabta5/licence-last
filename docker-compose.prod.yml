services:
  # ─── PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-stag}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - stag-net
    deploy:
      resources:
        limits:
          memory: 384M
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=50
      - -c
      - effective_cache_size=192MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stag}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "3"

  # ─── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 48mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - stag-net
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "3"

  # ─── Next.js Application ────────────────────────────────────
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE in .env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stag}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stag}
      REDIS_URL: redis://redis:6379
      REDIS_RATE_LIMIT_ENABLED: "true"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      NEXT_PUBLIC_BETTER_AUTH_URL: ${NEXT_PUBLIC_BETTER_AUTH_URL:?Set NEXT_PUBLIC_BETTER_AUTH_URL in .env}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      FEATURE_NOTIF_PREFERENCES: ${FEATURE_NOTIF_PREFERENCES:-true}
      FEATURE_SAVED_OFFERS: ${FEATURE_SAVED_OFFERS:-true}
      FEATURE_INTERVIEWS: ${FEATURE_INTERVIEWS:-true}
      FEATURE_LANGUAGE_REQUIREMENTS: ${FEATURE_LANGUAGE_REQUIREMENTS:-true}
      NEXT_PUBLIC_FEATURE_NOTIF_PREFERENCES: ${NEXT_PUBLIC_FEATURE_NOTIF_PREFERENCES:-true}
      NEXT_PUBLIC_FEATURE_SAVED_OFFERS: ${NEXT_PUBLIC_FEATURE_SAVED_OFFERS:-true}
      NEXT_PUBLIC_FEATURE_INTERVIEWS: ${NEXT_PUBLIC_FEATURE_INTERVIEWS:-true}
      NEXT_PUBLIC_FEATURE_LANGUAGE_REQUIREMENTS: ${NEXT_PUBLIC_FEATURE_LANGUAGE_REQUIREMENTS:-true}
      RUN_SEED: ${RUN_SEED:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_UNIVERSITY_ADMIN_EMAIL: ${SEED_UNIVERSITY_ADMIN_EMAIL:-}
      SEED_UNIVERSITY_ADMIN_PASSWORD: ${SEED_UNIVERSITY_ADMIN_PASSWORD:-}
      SEED_UNIVERSITY_ADMIN_UNIVERSITY_NAME: ${SEED_UNIVERSITY_ADMIN_UNIVERSITY_NAME:-}
      # Optional services
      AI_PROVIDER: ${AI_PROVIDER:-gateway}
      AI_API_KEY: ${AI_API_KEY:?Set AI_API_KEY in .env for AI-backed product features}
      AI_MODEL: ${AI_MODEL:-}
      AI_ALLOWED_MODELS: ${AI_ALLOWED_MODELS:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      POE_API_KEY: ${POE_API_KEY:-}
      POE_MODEL: ${POE_MODEL:-}
      POE_ALLOWED_MODELS: ${POE_ALLOWED_MODELS:-}
      POE_BASE_URL: ${POE_BASE_URL:-}
      ARCADE_API_KEY: ${ARCADE_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY in .env}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM in .env}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:?Set S3_PUBLIC_URL in .env}
      NEXT_PUBLIC_S3_URL: ${NEXT_PUBLIC_S3_URL:-}
      S3_REGION: ${S3_REGION:-auto}
      FEATURE_COMPANY_ASSISTANT: ${FEATURE_COMPANY_ASSISTANT:-false}
      NEXT_PUBLIC_FEATURE_COMPANY_ASSISTANT: ${NEXT_PUBLIC_FEATURE_COMPANY_ASSISTANT:-false}
    networks:
      - stag-net
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "3"

  # ─── Caddy (Reverse Proxy + Auto HTTPS) ─────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?Set DOMAIN_NAME in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - stag-net
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "3"

  # ─── Database Backup ────────────────────────────────────────
  backup:
    image: prodrigestivill/postgres-backup-local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-stag}
      POSTGRES_USER: ${POSTGRES_USER:-stag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 3
      HEALTHCHECK_PORT: 8080
    volumes:
      - ./backups:/backups
    networks:
      - stag-net
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "3"

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:

networks:
  stag-net:
    driver: bridge
