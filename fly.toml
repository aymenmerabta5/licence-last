app = 'azeldin'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3000'
  HOSTNAME = '0.0.0.0'
  NODE_ENV = 'production'
  NEXT_TELEMETRY_DISABLED = '1'
  
  # Rate limiting disabled for now
  REDIS_RATE_LIMIT_ENABLED = 'false'
  
  # Auth configuration
  NEXT_PUBLIC_BETTER_AUTH_URL = 'https://azeldin.de'
  BETTER_AUTH_TRUSTED_ORIGINS = 'https://azeldin.de,https://www.azeldin.de'
  
  # Features
  FEATURE_NOTIF_PREFERENCES = 'true'
  FEATURE_SAVED_OFFERS = 'true'
  FEATURE_INTERVIEWS = 'true'
  FEATURE_LANGUAGE_REQUIREMENTS = 'true'
  FEATURE_COMPANY_ASSISTANT = 'true'
  NEXT_PUBLIC_FEATURE_NOTIF_PREFERENCES = 'true'
  NEXT_PUBLIC_FEATURE_SAVED_OFFERS = 'true'
  NEXT_PUBLIC_FEATURE_INTERVIEWS = 'true'
  NEXT_PUBLIC_FEATURE_LANGUAGE_REQUIREMENTS = 'true'
  NEXT_PUBLIC_FEATURE_COMPANY_ASSISTANT = 'true'
  
  # Turnstile (Cloudflare Captcha)
  NEXT_PUBLIC_TURNSTILE_SITE_KEY = '0x4AAAAAACeEHDD-TKR8WLlg'
  
  # S3 / R2 Configuration
  S3_REGION = 'auto'
  S3_PUBLIC_URL = 'https://cdn.azeldin.de'
  NEXT_PUBLIC_S3_URL = 'https://cdn.azeldin.de'
  
  # AI Configuration
  AI_BASE_URL = 'https://api.poe.com/v1'
  AI_ALLOWED_MODELS = 'gpt-5.4,claude-opus-4.6,glm-5.1,gemini-3-flash,gemini-3.1-pro'
  
  # Email
  EMAIL_FROM = 'support@xendate.com'
  
  # Domain
  DOMAIN_NAME = 'azeldin.de'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/api/health'
    protocol = 'http'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'uploads_data'
  destination = '/app/uploads'
